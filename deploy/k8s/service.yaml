# redb.Tsak Worker — Service
# Exposes the REST API (9090) and the Prometheus metrics port (9464).
apiVersion: v1
kind: Service
metadata:
  name: redb-tsak-worker
  namespace: redb
  labels:
    app.kubernetes.io/name: redb-tsak-worker
    app.kubernetes.io/part-of: redb-tsak
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app.kubernetes.io/name: redb-tsak-worker
  ports:
    - { name: http, port: 9090, targetPort: http }   # REST API + /metrics
